services:
  - type: web
    name: unisphere-excel
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && npm run build"
    startCommand: "python -m uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: UNISPHERE_XLSX
        value: unisphere_database.xlsx